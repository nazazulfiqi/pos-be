basePath: /api
definitions:
  dto.CategoryResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.CreateCategoryRequest:
    properties:
      name:
        type: string
      tenant_id:
        description: Menambahkan tenant_id sebagai field yang wajib diisi
        type: string
    required:
    - name
    - tenant_id
    type: object
  dto.CreatePermissionRequest:
    properties:
      description:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  dto.CreateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      permission_ids:
        items:
          type: string
        type: array
      slug:
        type: string
      store_id:
        type: string
      tenant_id:
        type: string
    required:
    - name
    - slug
    type: object
  dto.CreateStoreRequest:
    properties:
      name:
        type: string
      owner_id:
        type: string
    required:
    - name
    type: object
  dto.CreateTenantRequest:
    properties:
      name:
        type: string
      store_id:
        type: string
    required:
    - name
    - store_id
    type: object
  dto.CreateTransactionRequest:
    properties:
      customer_id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.TransactionItemRequest'
        type: array
      payment_method:
        description: 1=Cash, 2=Midtrans
        enum:
        - 1
        - 2
        type: integer
      tenant_id:
        type: string
    required:
    - items
    - payment_method
    - tenant_id
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 5
        type: string
      role_ids:
        items:
          type: string
        type: array
      tenant_id:
        type: string
    required:
    - email
    - name
    - password
    - role_ids
    type: object
  dto.PayTransactionRequest:
    properties:
      amount_tendered:
        type: number
    required:
    - amount_tendered
    type: object
  dto.PayTransactionResponse:
    properties:
      amount_tendered:
        type: number
      change:
        type: number
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.TransactionItemResponse'
        type: array
      payment_method:
        type: integer
      payment_status:
        type: integer
      total_amount:
        type: number
    type: object
  dto.PermissionResponse:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  dto.ProductResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  dto.RoleResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/dto.PermissionResponse'
        type: array
      slug:
        type: string
      store_id:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.SignInRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.SignInResponse:
    properties:
      access_token:
        type: string
    type: object
  dto.StockMovementCreateRequest:
    properties:
      note:
        type: string
      product_id:
        type: string
      quantity:
        type: integer
      reference_id:
        type: string
      reference_type:
        description: 'contoh: "transaction", "order", "purchase"'
        type: string
      tenant_id:
        type: string
      type:
        description: validasi hanya "in" atau "out"
        enum:
        - in
        - out
        type: string
    required:
    - product_id
    - quantity
    - reference_type
    - type
    type: object
  dto.StockMovementResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      note:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      reference_id:
        type: string
      reference_type:
        type: string
      type:
        type: string
    type: object
  dto.StoreResponse:
    properties:
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
    type: object
  dto.TenantResponse:
    properties:
      id:
        type: string
      name:
        type: string
      store_id:
        type: string
    type: object
  dto.TransactionItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  dto.TransactionItemResponse:
    properties:
      price:
        type: number
      product_id:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
    type: object
  dto.TransactionResponse:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.TransactionItemResponse'
        type: array
      payment_method:
        description: 1=Cash, 2=Midtrans
        type: integer
      payment_status:
        type: integer
      tenant_id:
        type: string
      total_amount:
        type: number
      user_id:
        type: string
    type: object
  dto.UpdateCategoryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.UpdatePermissionRequest:
    properties:
      description:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  dto.UpdateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      permission_ids:
        items:
          type: string
        type: array
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  dto.UpdateStoreRequest:
    properties:
      name:
        type: string
      owner_id:
        type: string
    required:
    - name
    type: object
  dto.UpdateTenantRequest:
    properties:
      name:
        type: string
      store_id:
        type: string
    required:
    - name
    - store_id
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role_ids:
        items:
          type: string
        type: array
      tenant_id:
        type: string
    type: object
  response.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status_code:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: REST API for Point of Sale (POS) application with multi-tenant support.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: POS Backend API
  version: "1.0"
paths:
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access token
      parameters:
      - description: Sign In Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.SignInResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Login user
      tags:
      - Auth
  /categories:
    get:
      description: Retrieve list of categories (optionally filtered by tenant_id)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CategoryResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all categories
      tags:
      - Category
  /categories/:
    post:
      consumes:
      - application/json
      description: Create a new category
      parameters:
      - description: Create Category Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - Category
  /categories/{id}:
    delete:
      description: Delete a category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - Category
    get:
      description: Retrieve a single category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get category by ID
      tags:
      - Category
    put:
      consumes:
      - application/json
      description: Update an existing category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Category Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update category
      tags:
      - Category
  /categories/filter:
    get:
      description: Retrieve categories using search, pagination and tenant filter
      parameters:
      - description: Search term
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      - description: Tenant ID
        in: query
        name: tenant_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CategoryResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get categories with filter and pagination
      tags:
      - Category
  /me:
    get:
      description: Retrieve profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - User
  /permissions:
    get:
      description: Retrieve list of permissions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.PermissionResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all permissions
      tags:
      - Permission
  /permissions/:
    post:
      consumes:
      - application/json
      description: Create a new permission
      parameters:
      - description: Create Permission Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
