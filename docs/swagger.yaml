      - BearerAuth: []
      summary: Get all products
      tags:
      - Product
    post:
      consumes:
      - multipart/form-data
      description: Create a new product (multipart/form-data). Include `image` file
        optionally.
      parameters:
      - description: Product name
        in: formData
        name: name
        required: true
        type: string
      - description: Product SKU
        in: formData
        name: sku
        required: true
        type: string
      - description: Category ID
        in: formData
        name: category_id
        required: true
        type: string
      - description: Tenant ID
        in: formData
        name: tenant_id
        required: true
        type: string
      - description: Price
        in: formData
        name: price
        required: true
        type: number
      - description: Stock
        in: formData
        name: stock
        required: true
        type: integer
      - description: Image file
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductResponse'
              type: object
        "400":
          description: Bad Request
